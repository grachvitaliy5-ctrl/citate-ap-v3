<style>
@font-face{font-family:'Press Start 2P';src:url(fonts/PressStart2P-Regular.ttf);font-display:swap}
@font-face{font-family:'Pixelify Sans';src:url(fonts/PixelifySans.ttf);font-weight:400 700;font-display:swap}
/* Concept: real 3D space rendered at ~184px and upscaled without smoothing, one shared posterized+dithered palette so 3D, sprites, particles and fog share the same pixel; UI as a lacquered wooden plaque with paper tiles and red seals. Single dark look by choice. */
:root{
  --night:#0b0a1f;
  --wood:#21140f;
  --gold:#d7b06a;
  --paper:#ecdcb4;
  --ink:#2a1a12;
  --seal:#c0392b;
  --text:#f6ecd9;
  --dim:#b9a58a;
  --sakura:#ff8fb8;
  --pix:'Press Start 2P','Courier New',monospace;
  --body:'Pixelify Sans','PT Mono','Courier New',monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--body);overflow:hidden}
#app{position:relative;height:100%;width:100%;max-width:460px;margin:0 auto;overflow:hidden;background:var(--night);touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:absolute;left:0;top:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none;z-index:3;transition:opacity .8s}
.hud.hide{opacity:0}
.brand{font-family:var(--pix);font-size:11px;letter-spacing:.14em;color:var(--paper);background:var(--wood);border:2px solid var(--gold);padding:6px 8px;box-shadow:0 0 0 2px #120a07}
.hud-r{display:flex;gap:6px;pointer-events:auto}
.chip{font-family:var(--pix);font-size:7px;line-height:1;color:var(--paper);background:var(--wood);border:2px solid var(--gold);padding:7px 7px;cursor:pointer;box-shadow:0 0 0 2px #120a07}
.chip[aria-pressed="false"]{color:var(--dim);border-color:#7a6040}
.chip:focus-visible,.pbtn:focus-visible,.act:focus-visible,.cyc button:focus-visible,.coll button:focus-visible,.sw:focus-visible,.edel:focus-visible{outline:2px solid #fff;outline-offset:2px}
.panel{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:10px;z-index:3;padding:10px 12px 9px;display:flex;flex-direction:column;gap:7px;
  background:var(--wood) repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 9px);border:3px solid var(--gold);box-shadow:0 0 0 3px #120a07,inset 0 0 0 2px #4a2e1c,5px 6px 0 3px rgba(0,0,0,.55);transition:transform .8s cubic-bezier(.6,0,.2,1),opacity .6s}
.panel.away{transform:translateY(calc(100% + 26px));opacity:0;pointer-events:none}
.panel::before,.panel::after{content:"";position:absolute;width:6px;height:6px;background:var(--gold);box-shadow:0 0 0 2px #120a07;top:-6px}
.panel::before{left:-6px}.panel::after{right:-6px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lbl{font-family:var(--pix);font-size:8px;color:var(--gold);letter-spacing:.08em}
.stage{font-size:19px;font-weight:600;margin-top:5px;line-height:1.1;color:var(--text)}
.day{font-family:var(--pix);font-size:7px;color:var(--dim);text-align:right;line-height:1.7}
.wx{font-family:var(--pix);font-size:7px;color:var(--paper);display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:3px}
.wx b{width:8px;height:8px;display:inline-block;box-shadow:0 0 0 1px #000}
.hint{font-size:14px;color:var(--dim);line-height:1.3;min-height:18px}
.cyc{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cyc span{font-family:var(--pix);font-size:7px;color:var(--dim);margin-right:2px}
.cyc button{font-family:var(--pix);font-size:8px;color:var(--paper);background:#2c1b14;border:2px solid #6a4a30;padding:6px 8px;cursor:pointer}
.cyc button[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:#120a07}
.staff{position:relative;height:26px;background:#140c09 repeating-linear-gradient(180deg,transparent 0 4px,#4a3424 4px 5px);border:2px solid #4a2e1c}
.staff i{position:absolute;width:4px;height:4px;background:#5a4030;transform:translateX(-50%)}
.staff i.on{background:var(--sakura);box-shadow:0 0 0 1px #000}
.staff i.fx{background:var(--gold)}
.staff i.bad{background:#b0201a;box-shadow:0 0 0 1px #000;width:5px}
.staff i.hot{background:#fff}
.acts{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:6px}
.act{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px 9px;background:var(--paper);color:var(--ink);border:2px solid #120a07;box-shadow:inset -2px -3px 0 #c6b083,2px 2px 0 #000;font-family:var(--body);font-size:15px;font-weight:600;cursor:pointer;min-width:0}
.act svg{width:24px;height:24px;shape-rendering:crispEdges}
.act span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.act::before{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c)}
.act .st{position:absolute;top:4px;left:4px;width:6px;height:6px;background:#5fbf5a;box-shadow:0 0 0 1px #120a07}
.act .st.y{background:#f2c14e}.act .st.r{background:#e0453a}
.act:active{transform:translate(1px,1px)}
.act:disabled{cursor:default}
.act:not([aria-pressed="true"]):disabled{opacity:.6}
.act[aria-pressed="true"]{background:#d6c294;color:#6a5440}
.act[aria-pressed="true"]::after{content:"✓";position:absolute;top:3px;right:3px;width:16px;height:16px;display:grid;place-items:center;background:var(--seal);color:#fff2e0;font-family:var(--pix);font-size:8px;box-shadow:0 0 0 1px #5a1010;transform:rotate(-8deg)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.fbtn{display:flex;gap:6px;margin-left:auto}
.pbtn{font-family:var(--pix);font-size:8px;color:var(--ink);background:var(--gold);border:2px solid #120a07;padding:8px 10px;cursor:pointer;box-shadow:2px 2px 0 #000}
.pbtn.ghost{background:#2c1b14;color:var(--paper);border-color:#6a4a30}
.pbtn:disabled{opacity:.5;cursor:default}
.coll{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.coll span{font-family:var(--pix);font-size:7px;color:var(--dim)}
.coll button{font-family:var(--pix);font-size:7px;color:var(--paper);background:#2c1b14;border:2px solid var(--sakura);padding:5px 6px;cursor:pointer}
.coll button.bad{border-color:#b0201a;color:#d8a0a0}
.ed{position:absolute;inset:0;z-index:7;background:rgba(8,6,16,.72);display:flex;align-items:flex-end}
.sheet{width:100%;margin:10px;max-height:82%;overflow:auto;padding:12px;background:var(--wood);border:3px solid var(--gold);box-shadow:0 0 0 3px #120a07;display:flex;flex-direction:column;gap:8px}
.erow{display:grid;grid-template-columns:1fr auto;gap:6px;padding:8px 0;border-bottom:2px solid #4a2e1c}
.ein,.erow select{font-family:var(--body);font-size:16px;color:var(--ink);background:var(--paper);border:2px solid #120a07;padding:5px 7px;min-width:0}
.eopt{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sws{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.sw{width:24px;height:24px;border:2px solid #120a07;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid #fff;outline-offset:1px}
.edel{font-family:var(--pix);font-size:9px;color:var(--paper);background:#5a1a14;border:2px solid #120a07;padding:0 9px;cursor:pointer}
.elab{display:flex;flex-direction:column;gap:5px;font-family:var(--pix);font-size:7px;color:var(--dim);line-height:1.5}
.elab textarea{font-family:var(--body);font-size:16px;color:var(--ink);background:var(--paper);border:2px solid #120a07;padding:5px 7px;resize:none}
.sub{position:absolute;left:0;right:0;top:17%;text-align:center;padding:0 22px;font-family:var(--body);font-size:22px;font-weight:600;line-height:1.3;color:var(--text);text-shadow:2px 2px 0 #000,-1px -1px 0 #000;opacity:0;transition:opacity .7s steps(5);pointer-events:none;white-space:pre-line;z-index:4}
.sub.show{opacity:1}
.tap{position:absolute;left:0;right:0;bottom:14%;text-align:center;font-family:var(--pix);font-size:9px;letter-spacing:.14em;color:var(--paper);text-shadow:2px 2px 0 #000;z-index:4;animation:blink 1.6s steps(2) infinite;pointer-events:none}
.tap.gone{display:none}
.title{position:absolute;left:0;right:0;top:8%;text-align:center;font-family:var(--pix);font-size:30px;letter-spacing:.2em;color:var(--paper);text-shadow:4px 4px 0 #000;z-index:4;transition:opacity 1s;pointer-events:none}
.title em{font-style:normal;color:var(--sakura)}
.title.gone{opacity:0}
@keyframes blink{50%{opacity:.25}}
.bars{position:absolute;left:0;right:0;height:0;background:#000;pointer-events:none;transition:height .9s cubic-bezier(.6,0,.2,1);z-index:2}
.bars.top{top:0}.bars.bot{bottom:0}
.cine .bars{height:8%}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen;z-index:2}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:16px;color:var(--text);background:var(--night);z-index:9}
@media (prefers-reduced-motion:reduce){.sub,.panel,.bars,.title{transition:none}.tap{animation:none}}
@media (max-height:680px){.act{padding:6px 3px 7px;font-size:14px}.stage{font-size:17px}.hint{font-size:13px}}
body:not(.demo) #demo,body:not(.demo) #newday{display:none!important}
.goal{font-size:13px;color:var(--sakura);margin-top:3px;line-height:1.2;max-width:230px}
.gdays{font-family:var(--pix);font-size:8px;color:var(--gold);line-height:1.6}
#gGoal{font-family:var(--body);font-size:16px;color:var(--ink);background:var(--paper);border:2px solid #120a07;padding:5px 7px;resize:none}
#gCyc,#gIsl{font-family:var(--body);font-size:16px;color:var(--ink);background:var(--paper);border:2px solid #120a07;padding:5px 7px}
.duel{position:absolute;left:14px;right:14px;top:58px;z-index:5;display:flex;flex-direction:column;gap:6px;padding:8px 10px;background:rgba(18,10,7,.82);border:2px solid var(--gold);box-shadow:0 0 0 2px #120a07}
.drow{display:grid;grid-template-columns:52px 1fr 40px;align-items:center;gap:8px;font-family:var(--pix);font-size:8px;color:var(--paper)}
.drow i{display:block;height:10px;background:#140c09;border:2px solid #4a2e1c}
.drow b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe066,#ff8fb8);transition:width 1.6s steps(16)}
.drow.dark b{background:linear-gradient(90deg,#3a1460,#a03cff)}
.drow em{font-style:normal;text-align:right}
.etm{font-family:var(--body);font-size:16px;color:var(--ink);background:var(--paper);border:2px solid #120a07;padding:5px 7px;min-width:0}
.eopt3{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:end}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
</style>
