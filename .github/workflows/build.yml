name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build debug APK
        id: build
        run: gradle assembleDebug --stacktrace 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}
      # При ошибке сборки журнал сохраняется в ветку build-log, чтобы его можно было прочитать без входа на GitHub.
      - name: Save build log on failure
        if: failure()
        run: |
          cp /tmp/build.log /tmp/build-log.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan build-log
          git rm -rf . > /dev/null
          cp /tmp/build-log.txt ./build-log.txt
          git add build-log.txt
          git commit -m "Build log ${GITHUB_SHA}"
          git push -f origin build-log
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Save APK to branch apk-build
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/app-debug.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk-build
          git rm -rf . > /dev/null
          cp /tmp/app-debug.apk ./app-debug.apk
          git add app-debug.apk
          git commit -m "APK ${GITHUB_SHA}"
          git push -f origin apk-build

  # Запуск в эмуляторе: скриншоты и журнал уходят в ветку test-results
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/emulator_test.sh
      - name: Publish results
        if: always()
        run: |
          mkdir -p results
          cp -r results /tmp/results
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan test-results
          git rm -rf . > /dev/null
          cp -r /tmp/results/* .
          git add -A
          git commit -m "Test ${GITHUB_SHA}"
          git push -f origin test-results
