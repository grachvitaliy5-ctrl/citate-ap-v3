name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build debug APK
        id: build
        run: gradle assembleDebug --stacktrace 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}
      # При ошибке сборки журнал сохраняется в ветку build-log, чтобы его можно было прочитать без входа на GitHub.
      - name: Save build log on failure
        if: failure()
        run: |
          cp /tmp/build.log /tmp/build-log.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan build-log
          git rm -rf . > /dev/null
          cp /tmp/build-log.txt ./build-log.txt
          git add build-log.txt
          git commit -m "Build log ${GITHUB_SHA}"
          git push -f origin build-log
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Save APK to branch apk-build
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/app-debug.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk-build
          git rm -rf . > /dev/null
          cp /tmp/app-debug.apk ./app-debug.apk
          git add app-debug.apk
          git commit -m "APK ${GITHUB_SHA}"
          git push -f origin apk-build

  # Запуск в эмуляторе: скриншоты и журнал уходят в ветку test-results
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run in emulator
        timeout-minutes: 30
        run: |
          mkdir -p results
          (
            set -x
            export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH
            yes | sdkmanager --licenses > /dev/null
            sdkmanager "emulator" "platform-tools" "system-images;android-33;google_apis;x86_64"
            echo no | avdmanager create avd -n t -k "system-images;android-33;google_apis;x86_64" -d pixel_5
            nohup emulator -avd t -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none > results/emulator.log 2>&1 &
            adb wait-for-device
            for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break; sleep 5; done
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            sleep 20
            bash tools/emulator_test.sh
          ) > results/run.log 2>&1 || true
          tail -50 results/run.log
      - name: Publish results
        if: always()
        run: |
          mkdir -p results
          cp -r results /tmp/results
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan test-results
          git rm -rf . > /dev/null
          cp -r /tmp/results/. .
          echo "${GITHUB_SHA}" > sha.txt
          git add -A
          git commit -m "Test ${GITHUB_SHA}"
          git push -f origin test-results
